version: "3.9"

services:
  backend:
    image: python:3.11-slim
    command: python start.py --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
    working_dir: /app
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    entrypoint: /bin/sh -c "pip install -r backend/requirements.txt && python start.py --host 0.0.0.0 --port 8080"

  frontend:
    image: node:20-alpine
    command: sh -c "npm install --prefix frontend && npm run dev"
    ports:
      - "22704:22704"
    volumes:
      - ./:/app
    working_dir: /app
    depends_on:
      - backend
